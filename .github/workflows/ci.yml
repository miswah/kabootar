name: Fly Pipeline

on:
  pull_request:
    branches:
      - master

# Cancel an older run when a newer commit is pushed
# to the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default permissions.
permissions:
  contents: read

jobs:

  # ============================================================
  # Backend Quality
  # ============================================================
  backend-quality:
    name: Backend Quality & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25 & Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run formatting and static-analysis checks
        run: |
          mvn validate checkstyle:check \
            -Dcheckstyle.failsOnError=true \
            -Dcheckstyle.failOnViolation=true


  # ============================================================
  # Backend Unit Tests + Coverage
  # ============================================================
  backend-tests:
    name: Backend Unit Tests & Coverage
    runs-on: ubuntu-latest

    needs:
      - backend-quality

    env:
      # Disable Flyway during unit tests.
      # Integration tests below intentionally do NOT use this.
      SPRING_FLYWAY_ENABLED: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25 & Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile backend modules & run unit tests
        run: |
          mvn test \
            -pl '!configuration' \
            -am

      - name: Generate coverage reports
        if: always()
        run: |
          mvn test jacoco:report \
            -pl '!configuration' \
            -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            **/target/site/jacoco/**
          if-no-files-found: warn


  # ============================================================
  # Integration Tests - Testcontainers
  # ============================================================
  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest

    needs:
      - backend-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25 & Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Testcontainers-based integration tests
        run: mvn verify -DskipUnitTests

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            **/target/failsafe-reports/**
          if-no-files-found: warn


  # ============================================================
  # Dependency / Filesystem Security Scan
  # ============================================================
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          security-checks: vuln,config
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate Trivy filesystem report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          security-checks: vuln,config
          format: json
          output: trivy-filesystem-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-filesystem-report.json
          if-no-files-found: warn


  # ============================================================
  # Container Builds + Container Vulnerability Scans
  # ============================================================
  container-build:
    name: Container - ${{ matrix.service }}

    needs:
      - backend-tests
      - integration-tests
      - security-scan

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - configuration
          - gateway
          - admin
          - alert
          - common
          - monitor
          - simulator

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Java 25 & Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build application JAR
        run: mvn package -DskipTests

      - name: Build ${{ matrix.service }} container image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            kabootar/${{ matrix.service }}:${{ github.sha }}
            kabootar/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan ${{ matrix.service }} container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kabootar/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate Trivy container report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kabootar/${{ matrix.service }}:${{ github.sha }}
          format: json
          output: trivy-${{ matrix.service }}-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-report
          path: trivy-${{ matrix.service }}-report.json
          if-no-files-found: warn