spring.application.name=configuration

spring.flyway.locations=classpath:db/migration
# Disable Hibernate's automatic schema creation to let Flyway handle it
spring.jpa.hibernate.ddl-auto=validate

#spring.flyway.url=jdbc:mariadb://172.21.0.2/kabootar_db
#spring.flyway.user=root
#spring.flyway.password=mypass

# Optional Flyway Configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=jdbc:mariadb://172.21.0.2/kabootar_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mypass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

debug=false
