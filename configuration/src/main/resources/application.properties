spring.application.name=configuration

flyway.enabled=false

# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=jdbc:mariadb://172.21.0.2/kabootar_db
spring.datasource.username=root
